name: ci
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: "./histos test"
  workflow:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: "./histos workflow --check"
