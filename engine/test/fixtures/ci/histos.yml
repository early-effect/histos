name: ci
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
      - uses: actions/cache@v6
        id: llvm
        with:
          path: "${{ runner.temp }}/llvm"
          key: "llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}"
      - uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: "21.1.8"
          directory: "${{ runner.temp }}/llvm"
          cached: "${{ steps.llvm.outputs.cache-hit }}"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/chekhov/playwright/1.62.1
            ~/.cache/ms-playwright
          key: "playwright-1.62.1-${{ runner.os }}-${{ runner.arch }}"
      - run: |
          dir="$HOME/.cache/chekhov/playwright/1.62.1"
          mkdir -p "$dir"
          npm install --prefix "$dir" --no-fund --no-audit --no-progress playwright@1.62.1
          node "$dir/node_modules/playwright/cli.js" install-deps firefox
          node "$dir/node_modules/playwright/cli.js" install firefox
      - uses: actions/cache@v6
        with:
          path: "~/.cache/coursier/v1"
          key: "coursier-${{ hashFiles('.histos/dependencies.lock') }}-${{ runner.os }}-${{ runner.arch }}"
      - run: "./histos test"
        env:
          HISTOS_CACHE_NAMESPACE: "${{ case(github.event_name == 'pull_request', format('pr/{0}', github.event.pull_request.number), 'main') }}"
  versions:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: "./histos run versions"
  workflow:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: "./histos workflow --check"
