name: ci
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "./histos test"
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: "./histos run dev.example/site"
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "./histos workflow --check"
