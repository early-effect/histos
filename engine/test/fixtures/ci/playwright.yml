name: ci
on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      modules: ${{ steps.affected.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight affected
      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=all
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            last=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&status=success&branch=${GITHUB_REF_NAME}&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)
            if [ -n "$last" ] && git merge-base --is-ancestor "$last" HEAD; then
              base="$last"
            fi
          fi
          modules=$(./histos affected --base "$base" || echo '["all"]')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
  test:
    needs: affected
    if: "(github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (!cancelled() && !contains(needs.*.result, 'failure'))"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight test
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright
        with:
          path: |
            ~/.cache/chekhov/playwright/1.49.0
            ~/.cache/ms-playwright
          key: "playwright-1.49.0-${{ runner.os }}-${{ runner.arch }}"
      - run: |
          dir="$HOME/.cache/chekhov/playwright/1.49.0"
          if [ "${{ steps.playwright.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$dir"
            npm install --prefix "$dir" --no-fund --no-audit --no-progress playwright@1.49.0
            node "$dir/node_modules/playwright/cli.js" install firefox
          fi
          test -d "$dir/node_modules/playwright"
          node "$dir/node_modules/playwright/cli.js" install-deps firefox
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/coursier/v1"
          key: "coursier-${{ hashFiles('histos.scala') }}-${{ runner.os }}-${{ runner.arch }}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: store
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
      - run: "./histos test --affected '${{ needs.affected.outputs.modules }}'"
        env:
          HISTOS_CACHE_NAMESPACE: "${{ case(github.event_name == 'pull_request', format('pr/{0}', github.event.pull_request.number), 'main') }}"
      - if: "always()"
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_KEY: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
        run: |
          if [ "${{ steps.store.outputs.cache-hit }}" = "true" ]; then
            gh api --method DELETE /repos/${GITHUB_REPOSITORY}/actions/caches?key=${STORE_KEY}
          fi
      - if: "always()"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
  cache-seed:
    if: "github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight cache-seed
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright
        with:
          path: |
            ~/.cache/chekhov/playwright/1.49.0
            ~/.cache/ms-playwright
          key: "playwright-1.49.0-${{ runner.os }}-${{ runner.arch }}"
      - run: |
          dir="$HOME/.cache/chekhov/playwright/1.49.0"
          if [ "${{ steps.playwright.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$dir"
            npm install --prefix "$dir" --no-fund --no-audit --no-progress playwright@1.49.0
            node "$dir/node_modules/playwright/cli.js" install firefox
          fi
          test -d "$dir/node_modules/playwright"
          node "$dir/node_modules/playwright/cli.js" install-deps firefox
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/coursier/v1"
          key: "coursier-${{ hashFiles('histos.scala') }}-${{ runner.os }}-${{ runner.arch }}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: store
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
      - run: "./histos compile"
      - if: "always()"
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_KEY: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
        run: |
          if [ "${{ steps.store.outputs.cache-hit }}" = "true" ]; then
            gh api --method DELETE /repos/${GITHUB_REPOSITORY}/actions/caches?key=${STORE_KEY}
          fi
      - if: "always()"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
  workflow:
    if: "github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - uses: ./.github/actions/origin-head
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight workflow
      - id: app
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HISTOS_APP_ID }}
          private-key: ${{ secrets.HISTOS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - run: ./histos doctor
        env:
          HISTOS_SECRET_PRESENT_HISTOS_APP_ID: ${{ secrets.HISTOS_APP_ID != '' }}
          HISTOS_SECRET_PRESENT_HISTOS_APP_PRIVATE_KEY: ${{ secrets.HISTOS_APP_PRIVATE_KEY != '' }}
          HISTOS_STEP_APP: ${{ steps.app.outcome }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
      - run: "./histos workflow --check"
  supply-chain:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - uses: ./.github/actions/origin-head
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/histos/advisories
          key: histos-osv-${{ hashFiles('dependencies.lock') }}-${{ github.run_id }}
          restore-keys: histos-osv-
      - run: ./histos doctor --preflight supply-chain
      - id: app
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HISTOS_APP_ID }}
          private-key: ${{ secrets.HISTOS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - run: ./histos doctor
        env:
          HISTOS_SECRET_PRESENT_HISTOS_APP_ID: ${{ secrets.HISTOS_APP_ID != '' }}
          HISTOS_SECRET_PRESENT_HISTOS_APP_PRIVATE_KEY: ${{ secrets.HISTOS_APP_PRIVATE_KEY != '' }}
          HISTOS_STEP_APP: ${{ steps.app.outcome }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
      - run: ./histos workflow --check
      - run: ./histos resolve --check
      - run: ./histos deps audit
      - if: failure() && github.event_name != 'pull_request'
        run: ./histos deps alert
        env:
          GH_TOKEN: ${{ github.token }}
  dependency-snapshot:
    if: "github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight dependency-snapshot
      - run: ./histos deps snapshot --submit
        env:
          GH_TOKEN: ${{ github.token }}
