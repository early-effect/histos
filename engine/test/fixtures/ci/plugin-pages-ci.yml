name: ci
on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    outputs:
      modules: ${{ steps.affected.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight affected
      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=all
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            last=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&status=success&branch=${GITHUB_REF_NAME}&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)
            if [ -n "$last" ] && git merge-base --is-ancestor "$last" HEAD; then
              base="$last"
            fi
          fi
          modules=$(./histos affected --base "$base" || echo '["all"]')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
  test:
    needs: affected
    if: "(github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (!cancelled() && !contains(needs.*.result, 'failure'))"
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight test
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/coursier/v1"
          key: "coursier-${{ hashFiles('histos.scala') }}-${{ runner.os }}-${{ runner.arch }}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: store
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
      - run: "./histos test --affected '${{ needs.affected.outputs.modules }}'"
        env:
          HISTOS_CACHE_NAMESPACE: "${{ case(github.event_name == 'pull_request', format('pr/{0}', github.event.pull_request.number), 'main') }}"
      - if: "always()"
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_KEY: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
        run: |
          if [ "${{ steps.store.outputs.cache-hit }}" = "true" ]; then
            gh api --method DELETE /repos/${GITHUB_REPOSITORY}/actions/caches?key=${STORE_KEY}
          fi
      - if: "always()"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
  docs:
    if: "github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight docs
      - run: "./histos run dev.example/site"
      - if: "github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "target/site"
  pages:
    needs: docs
    if: "github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  cache-seed:
    if: "github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight cache-seed
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/coursier/v1"
          key: "coursier-${{ hashFiles('histos.scala') }}-${{ runner.os }}-${{ runner.arch }}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: store
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
      - run: "./histos compile"
      - if: "always()"
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_KEY: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
        run: |
          if [ "${{ steps.store.outputs.cache-hit }}" = "true" ]; then
            gh api --method DELETE /repos/${GITHUB_REPOSITORY}/actions/caches?key=${STORE_KEY}
          fi
      - if: "always()"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
  workflow:
    if: "github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight workflow
      - run: ./histos doctor
      - run: "./histos workflow --check"
  supply-chain:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/histos/advisories
          key: histos-osv-${{ hashFiles('dependencies.lock') }}-${{ github.run_id }}
          restore-keys: histos-osv-
      - run: ./histos doctor --preflight supply-chain
      - run: ./histos doctor
      - run: ./histos workflow --check
      - run: ./histos resolve --check
      - run: ./histos deps audit
      - if: failure() && github.event_name != 'pull_request'
        run: ./histos deps alert
        env:
          GH_TOKEN: ${{ github.token }}
  dependency-snapshot:
    if: "github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight dependency-snapshot
      - run: ./histos deps snapshot --submit
