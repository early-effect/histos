name: ci
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "./histos test"
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "./histos format --check"
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "./histos workflow --check"
  publish:
    needs:
      - test
      - format
      - workflow
    if: "startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "./histos publish"
