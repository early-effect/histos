name: Setup Histos
description: Install the Histos shim and restore toolchains and Coursier
inputs:
  version:
    description: Histos version. Empty installs histos.version from build.properties.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Toolchains
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.histos/toolchains
        key: histos-toolchains-${{ inputs.version }}-${{ hashFiles('build.properties') }}-${{ runner.os }}-${{ runner.arch }}
    - name: Coursier
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/coursier/v1
        key: coursier-${{ hashFiles('dependencies.lock', 'histos.scala') }}-${{ runner.os }}-${{ runner.arch }}
    - name: Install
      shell: bash
      env:
        HISTOS_VERSION: ${{ inputs.version }}
      run: |
        shim="${GITHUB_ACTION_PATH}/histos"
        version=$HISTOS_VERSION
        if [ -z "$version" ] && [ -f build.properties ]; then
          version=$(awk '
            /^[ \t]*#/ || /^[ \t]*$/ { next }
            {
              eq = index($0, "=")
              if (eq <= 1) exit 1
              key = substr($0, 1, eq - 1)
              value = substr($0, eq + 1)
              gsub(/^[ \t]+|[ \t]+$/, "", key)
              gsub(/^[ \t]+|[ \t]+$/, "", value)
              if (key == "histos.version" && value != "") { print value; found = 1; exit }
            }
            END { if (!found) exit 1 }
          ' build.properties) || {
            echo "histos: could not read histos.version from build.properties" >&2
            exit 1
          }
        fi
        if [ -n "$version" ]; then
          "$shim" toolchain install "$version"
          printf '%s\n' "$version" > "$HOME/.histos/default"
        else
          "$shim"
        fi
        echo "$HOME/.histos/bin" >> "$GITHUB_PATH"
