name: release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-histos:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: early-effect/histos/.github/actions/setup@4a49a640bc8345737c22160b4e67b028d61cd908 # 4a49a640bc8345737c22160b4e67b028d61cd908
      - run: ./histos doctor --preflight release-histos
      - run: "./histos publish release histos"
        env:
          HISTOS_SESSION: release
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_KEY_HEX: ${{ secrets.PGP_KEY_HEX }}
      - run: "./histos assembly app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: histos-jar
          path: dist/histos.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-kit
          path: dist/client-kit.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shim
          path: install/histos
          if-no-files-found: error
  install:
    needs: [release-histos]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: early-effect/histos/.github/actions/setup@4a49a640bc8345737c22160b4e67b028d61cd908 # 4a49a640bc8345737c22160b4e67b028d61cd908
      - run: ./histos doctor --preflight install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-in
      - run: |
          set -eu
          version=0.4.3
          jar=dist-in/histos-jar/histos.jar
          kit=dist-in/client-kit/client-kit.zip
          sha() { sha256sum "$1" | awk '{print $1}'; }
          jar_sha=$(sha "$jar")
          kit_sha=$(sha "$kit")
          cp "$jar" "$version-histos.jar"
          cp "$kit" "$version-client-kit.zip"
          shim_file=dist-in/shim/histos
          shim_sha=$(sha "$shim_file")
          cp "$shim_file" shim
          cp "$shim_file" "shim-$shim_sha"
          printf '%s\n' "$shim_sha" > shim.sha256
          cat > "$version-manifest.json" <<EOF
          {
            "version": "$version",
            "jar": "$version-histos.jar",
            "jarSha256": "$jar_sha",
            "clientKit": "$version-client-kit.zip",
            "clientKitSha256": "$kit_sha"
          }
          EOF
          gh release upload dist "$version-manifest.json" "$version-histos.jar" "$version-client-kit.zip" "shim-$shim_sha" shim shim.sha256 --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
