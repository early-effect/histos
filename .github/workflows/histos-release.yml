name: release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-histos:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: |
          usage=$(./histos 2>&1 || true)
          case "$usage" in
            *" doctor "*) ;;
            *) ./histos assembly ;;
          esac
      - run: ./histos doctor --preflight release-histos
      - run: "./histos publish release histos"
        env:
          HISTOS_SESSION: release
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_KEY_HEX: ${{ secrets.PGP_KEY_HEX }}
      - run: "./histos assembly"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: histos-jar
          path: dist/histos.jar
          if-no-files-found: error
      - run: cp .histos/assembly.sha256 dist/assembly.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: histos-bootstrap
          if-no-files-found: error
          path: |
            dist/histos.jar
            dist/assembly.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shim
          path: install/histos
          if-no-files-found: error
  client:
    needs: [release-histos]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux-x86_64
            archive: LLVM-21.1.8-Linux-X64.tar.xz
            sha256: b3b7f2801d15d50736acea3c73982994d025b01c2f035b91ae3b49d1b575732b
          - runner: macos-26
            platform: macos-aarch64
            archive: LLVM-21.1.8-macOS-ARM64.tar.xz
            sha256: b95bdd32a33a81ee4d40363aaeb26728a26783fcef26a4d80f65457433ea4669
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: histos-bootstrap
          path: histos-bootstrap
      - run: |
          if [ -f histos-bootstrap/dist/histos.jar ]; then
            jar=histos-bootstrap/dist/histos.jar
            sum=histos-bootstrap/dist/assembly.sha256
          else
            jar=histos-bootstrap/histos.jar
            sum=histos-bootstrap/assembly.sha256
          fi
          if [ -f "$jar" ] && [ -f "$sum" ]; then
            mkdir -p dist .histos
            mv "$jar" dist/histos.jar
            mv "$sum" .histos/assembly.sha256
          fi
      - run: ./histos doctor --preflight client
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: llvm
        with:
          path: "${{ runner.temp }}/llvm"
          key: "llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}"
      - run: |
          dir="${{ runner.temp }}/llvm"
          if [ "${{ steps.llvm.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$dir"
            curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/${{ matrix.archive }}" -o "$dir/llvm.tar.xz"
            expected="${{ matrix.sha256 }}"
            got=$(openssl dgst -sha256 "$dir/llvm.tar.xz" | awk '{print $NF}')
            [ "$got" = "$expected" ] || { echo "llvm checksum mismatch" >&2; exit 1; }
            tar -xJf "$dir/llvm.tar.xz" -C "$dir" --strip-components=1
            rm "$dir/llvm.tar.xz"
          fi
          test -x "$dir/bin/clang"
          echo "$dir/bin" >> "$GITHUB_PATH"
          if [ "$(uname -s)" = Linux ]; then
            if [ -n "$LD_LIBRARY_PATH" ]; then
              echo "LD_LIBRARY_PATH=$dir/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
            else
              echo "LD_LIBRARY_PATH=$dir/lib" >> "$GITHUB_ENV"
            fi
          fi
          if [ "$(uname -s)" = Darwin ]; then
            sdk=$(xcrun --show-sdk-path)
            wrap="${{ runner.temp }}/clang-sdk"
            mkdir -p "$wrap"
            for tool in clang clang++; do
              printf '%s\n' '#!/bin/sh' "exec \"$dir/bin/$tool\" -isysroot \"$sdk\" \"\$@\"" > "$wrap/$tool"
              chmod +x "$wrap/$tool"
            done
            echo "$wrap" >> "$GITHUB_PATH"
          fi
      - run: "./histos client"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-${{ matrix.platform }}
          path: dist/histos-client
          if-no-files-found: error
  install:
    needs: client
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: histos-bootstrap
          path: histos-bootstrap
      - run: |
          if [ -f histos-bootstrap/dist/histos.jar ]; then
            jar=histos-bootstrap/dist/histos.jar
            sum=histos-bootstrap/dist/assembly.sha256
          else
            jar=histos-bootstrap/histos.jar
            sum=histos-bootstrap/assembly.sha256
          fi
          if [ -f "$jar" ] && [ -f "$sum" ]; then
            mkdir -p dist .histos
            mv "$jar" dist/histos.jar
            mv "$sum" .histos/assembly.sha256
          fi
      - run: ./histos doctor --preflight install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-in
      - run: |
          set -eu
          version=0.2.5
          jar=dist-in/histos-jar/histos.jar
          linux=dist-in/client-linux-x86_64/histos-client
          mac=dist-in/client-macos-aarch64/histos-client
          sha() { sha256sum "$1" | awk '{print $1}'; }
          jar_sha=$(sha "$jar")
          linux_sha=$(sha "$linux")
          mac_sha=$(sha "$mac")
          cp "$jar" "$version-histos.jar"
          cp "$linux" "$version-client-linux-x86_64"
          cp "$mac" "$version-client-macos-aarch64"
          shim_file=dist-in/shim/histos
          shim_sha=$(sha "$shim_file")
          cp "$shim_file" shim
          printf '%s\n' "$shim_sha" > shim.sha256
          cat > "$version-manifest.json" <<EOF
          {
            "version": "$version",
            "jar": "$version-histos.jar",
            "jarSha256": "$jar_sha",
            "clients": {
              "linux-x86_64": "$linux_sha",
              "macos-aarch64": "$mac_sha"
            }
          }
          EOF
          gh release upload dist "$version-manifest.json" "$version-histos.jar" "$version-client-linux-x86_64" "$version-client-macos-aarch64" shim shim.sha256 --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
