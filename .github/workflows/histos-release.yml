name: release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-histos:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: "./histos publish release histos"
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_KEY_HEX: ${{ secrets.PGP_KEY_HEX }}
      - run: "./histos assembly"
      - uses: actions/upload-artifact@v7
        with:
          name: histos-jar
          path: dist/histos.jar
          if-no-files-found: error
  client:
    needs: [release-histos]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux-x86_64
            archive: LLVM-21.1.8-Linux-X64.tar.xz
          - runner: macos-26
            platform: macos-aarch64
            archive: LLVM-21.1.8-macOS-ARM64.tar.xz
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          java: "25"
      - uses: actions/cache@v6
        id: llvm
        with:
          path: "${{ runner.temp }}/llvm"
          key: "llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}"
      - run: |
          dir="${{ runner.temp }}/llvm"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/${{ matrix.archive }}" -o "$dir/llvm.tar.xz"
          tar -xJf "$dir/llvm.tar.xz" -C "$dir" --strip-components=1
          rm "$dir/llvm.tar.xz"
        if: steps.llvm.outputs.cache-hit != 'true'
      - run: |
          dir="${{ runner.temp }}/llvm"
          echo "$dir/bin" >> "$GITHUB_PATH"
          if [ "$(uname -s)" = Linux ]; then
            if [ -n "$LD_LIBRARY_PATH" ]; then
              echo "LD_LIBRARY_PATH=$dir/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
            else
              echo "LD_LIBRARY_PATH=$dir/lib" >> "$GITHUB_ENV"
            fi
          fi
          if [ "$(uname -s)" = Darwin ]; then
            sdk=$(xcrun --show-sdk-path)
            wrap="${{ runner.temp }}/clang-sdk"
            mkdir -p "$wrap"
            for tool in clang clang++; do
              printf '%s\n' '#!/bin/sh' "exec \"$dir/bin/$tool\" -isysroot \"$sdk\" \"\$@\"" > "$wrap/$tool"
              chmod +x "$wrap/$tool"
            done
            echo "$wrap" >> "$GITHUB_PATH"
          fi
      - run: "./histos client"
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.platform }}
          path: dist/histos-client
          if-no-files-found: error
  install:
    needs: client
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-in
      - run: |
          set -eu
          version=0.1.1
          jar=dist-in/histos-jar/histos.jar
          linux=dist-in/client-linux-x86_64/histos-client
          mac=dist-in/client-macos-aarch64/histos-client
          sha() { sha256sum "$1" | awk '{print $1}'; }
          jar_sha=$(sha "$jar")
          linux_sha=$(sha "$linux")
          mac_sha=$(sha "$mac")
          cp "$jar" "$version-histos.jar"
          cp "$linux" "$version-client-linux-x86_64"
          cp "$mac" "$version-client-macos-aarch64"
          cat > "$version-manifest.json" <<EOF
          {
            "version": "$version",
            "jar": "$version-histos.jar",
            "jarSha256": "$jar_sha",
            "clients": {
              "linux-x86_64": "$linux_sha",
              "macos-aarch64": "$mac_sha"
            }
          }
          EOF
          gh release upload dist "$version-manifest.json" "$version-histos.jar" "$version-client-linux-x86_64" "$version-client-macos-aarch64" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
