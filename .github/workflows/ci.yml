          assets="$GITHUB_WORKSPACE/host/assets"
          ivy="$GITHUB_WORKSPACE/host/ivy"
          HISTOS_ASSETS="$assets" HISTOS_IVY="$ivy" install/histos toolchain install --no-client "$version"
          mkdir -p .histos
          printf '%s\n' "$version" > .histos/toolchain
