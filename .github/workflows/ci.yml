      - run: |
          dir="$HOME/.cache/chekhov/playwright/1.62.1"
          if [ "${{ steps.playwright.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$dir"
            npm install --prefix "$dir" --no-fund --no-audit --no-progress playwright@1.62.1
            node "$dir/node_modules/playwright/cli.js" install firefox
          fi
          test -d "$dir/node_modules/playwright"
          find /etc/apt -type f -print0 | xargs -0 -r sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'
          timeout 180s node "$dir/node_modules/playwright/cli.js" install-deps firefox
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/coursier/v1"
          key: "coursier-${{ hashFiles('histos.scala') }}-${{ runner.os }}-${{ runner.arch }}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: store
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
      - run: "./histos compile"
        env:
          HISTOS_CACHE_NAMESPACE: "main"
          HISTOS_CACHE_MODE: "write"
      - if: "always()"
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_KEY: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
        run: |
          if [ "${{ steps.store.outputs.cache-hit }}" = "true" ]; then
            gh api --method DELETE /repos/${GITHUB_REPOSITORY}/actions/caches?key=${STORE_KEY}
          fi
      - if: "always()"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
  workflow:
    if: "github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - run: git remote set-head origin --auto
      - uses: early-effect/histos/.github/actions/setup@36642bcc3ec518a6af424b72b7e0d1f8b38c9333 # 36642bcc3ec518a6af424b72b7e0d1f8b38c9333
      - run: ./histos doctor --preflight workflow
      - id: app
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HISTOS_APP_ID }}
          private-key: ${{ secrets.HISTOS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - run: ./histos doctor
        env:
          HISTOS_SECRET_PRESENT_HISTOS_APP_ID: ${{ secrets.HISTOS_APP_ID != '' }}
          HISTOS_SECRET_PRESENT_HISTOS_APP_PRIVATE_KEY: ${{ secrets.HISTOS_APP_PRIVATE_KEY != '' }}
          HISTOS_STEP_APP: ${{ steps.app.outcome }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
      - run: "./histos workflow --check"
  supply-chain:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - run: git remote set-head origin --auto
      - uses: early-effect/histos/.github/actions/setup@36642bcc3ec518a6af424b72b7e0d1f8b38c9333 # 36642bcc3ec518a6af424b72b7e0d1f8b38c9333
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/histos/advisories
          key: histos-osv-${{ hashFiles('dependencies.lock') }}-${{ github.run_id }}
          restore-keys: histos-osv-
      - run: ./histos doctor --preflight supply-chain
      - id: app
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HISTOS_APP_ID }}
          private-key: ${{ secrets.HISTOS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - run: ./histos doctor
        env:
          HISTOS_SECRET_PRESENT_HISTOS_APP_ID: ${{ secrets.HISTOS_APP_ID != '' }}
          HISTOS_SECRET_PRESENT_HISTOS_APP_PRIVATE_KEY: ${{ secrets.HISTOS_APP_PRIVATE_KEY != '' }}
          HISTOS_STEP_APP: ${{ steps.app.outcome }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
      - run: ./histos workflow --check
      - run: ./histos resolve --check
      - run: ./histos deps audit
      - if: failure() && github.event_name != 'pull_request'
        run: ./histos deps alert
        env:
          GH_TOKEN: ${{ github.token }}
  dependency-snapshot:
    if: "github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: early-effect/histos/.github/actions/setup@36642bcc3ec518a6af424b72b7e0d1f8b38c9333 # 36642bcc3ec518a6af424b72b7e0d1f8b38c9333
      - run: ./histos doctor --preflight dependency-snapshot
      - run: ./histos deps snapshot --submit
        env:
          GH_TOKEN: ${{ github.token }}
