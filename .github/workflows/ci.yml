name: ci
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "./histos test"
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "./histos run versions"
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "./histos workflow --check"
