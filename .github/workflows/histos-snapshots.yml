name: snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: early-effect/histos/.github/actions/setup@1972f6fb54834cf556f3687a87cc3201503fc3d4 # 1972f6fb54834cf556f3687a87cc3201503fc3d4
      - run: ./histos doctor --preflight snapshots
      - run: "./histos publish snapshots"
        env:
          HISTOS_SESSION: snapshot
          HISTOS_SHA: ${{ github.sha }}
          HISTOS_BRANCH: default
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
