name: dogfood
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier/v1
            ~/.cache/scala-cli
          key: "scala-cli-1.18.0-${{ hashFiles('.histos/dependencies.lock') }}-${{ runner.os }}-${{ runner.arch }}"
      - uses: actions/cache@v6
        with:
          path: .histos/dogfood
          key: "dogfood-${{ hashFiles('dogfood', '.histos/dependencies.lock', 'api/src/**', 'central/src/**', 'engine/src/**', 'app/src/**') }}-${{ runner.os }}-${{ runner.arch }}"
      - name: Install scala-cli
        run: |
          case "${{ runner.arch }}" in
            X64) asset=scala-cli-x86_64-pc-linux ;;
            ARM64) asset=scala-cli-aarch64-pc-linux ;;
            *) echo "unsupported architecture: ${{ runner.arch }}" >&2
               exit 1 ;;
          esac
          curl -fsSL --proto '=https' --proto-redir '=https' \
            "https://github.com/VirtusLab/scala-cli/releases/download/v1.18.0/${asset}.gz" \
            -o "$RUNNER_TEMP/scala-cli.gz"
          gzip -dc "$RUNNER_TEMP/scala-cli.gz" > "$RUNNER_TEMP/scala-cli"
          chmod +x "$RUNNER_TEMP/scala-cli"
          sudo mv "$RUNNER_TEMP/scala-cli" /usr/local/bin/scala-cli
          scala-cli version
      - run: ./dogfood version
  test:
    needs: compile
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
      - uses: actions/cache@v6
        id: llvm
        with:
          path: "${{ runner.temp }}/llvm"
          key: "llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}"
      - uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: "21.1.8"
          directory: "${{ runner.temp }}/llvm"
          cached: "${{ steps.llvm.outputs.cache-hit }}"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/chekhov/playwright/1.62.1
            ~/.cache/ms-playwright
          key: "playwright-1.62.1-${{ runner.os }}-${{ runner.arch }}"
      - run: |
          dir="$HOME/.cache/chekhov/playwright/1.62.1"
          mkdir -p "$dir"
          npm install --prefix "$dir" --no-fund --no-audit --no-progress playwright@1.62.1
          node "$dir/node_modules/playwright/cli.js" install-deps firefox
          node "$dir/node_modules/playwright/cli.js" install firefox
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier/v1
            ~/.cache/scala-cli
          key: "scala-cli-1.18.0-${{ hashFiles('.histos/dependencies.lock') }}-${{ runner.os }}-${{ runner.arch }}"
      - uses: actions/cache@v6
        with:
          path: .histos/dogfood
          key: "dogfood-${{ hashFiles('dogfood', '.histos/dependencies.lock', 'api/src/**', 'central/src/**', 'engine/src/**', 'app/src/**') }}-${{ runner.os }}-${{ runner.arch }}"
      - name: Install scala-cli
        run: |
          case "${{ runner.arch }}" in
            X64) asset=scala-cli-x86_64-pc-linux ;;
            ARM64) asset=scala-cli-aarch64-pc-linux ;;
            *) echo "unsupported architecture: ${{ runner.arch }}" >&2
               exit 1 ;;
          esac
          curl -fsSL --proto '=https' --proto-redir '=https' \
            "https://github.com/VirtusLab/scala-cli/releases/download/v1.18.0/${asset}.gz" \
            -o "$RUNNER_TEMP/scala-cli.gz"
          gzip -dc "$RUNNER_TEMP/scala-cli.gz" > "$RUNNER_TEMP/scala-cli"
          chmod +x "$RUNNER_TEMP/scala-cli"
          sudo mv "$RUNNER_TEMP/scala-cli" /usr/local/bin/scala-cli
          scala-cli version
      - run: ./dogfood test
        env:
          HISTOS_CACHE_NAMESPACE: "${{ case(github.event_name == 'pull_request', format('pr/{0}', github.event.pull_request.number), 'main') }}"
