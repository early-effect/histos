# Generated by histos. Do not edit. Run './histos workflow --update' to regenerate.
name: histos-deps
on:
  schedule:
    - cron: "0 6 * * 1"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      dry-run:
        description: doctor plus update, no branch or pull request
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: histos-deps
  cancel-in-progress: false
jobs:
  deps:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - id: app
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HISTOS_APP_ID }}
          private-key: ${{ secrets.HISTOS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
          persist-credentials: false
      - uses: ./.github/actions/origin-head
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight histos-deps
        env:
          HISTOS_SECRET_PRESENT_HISTOS_APP_ID: ${{ secrets.HISTOS_APP_ID != '' }}
          HISTOS_SECRET_PRESENT_HISTOS_APP_PRIVATE_KEY: ${{ secrets.HISTOS_APP_PRIVATE_KEY != '' }}
          HISTOS_STEP_APP: ${{ steps.app.outcome }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
      - run: ./histos deps update --yes
      - run: ./histos resolve --update
      - run: ./histos workflow --update
      - run: ./histos deps audit --report
      - if: inputs.dry-run != true
        run: ./histos deps pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HISTOS_DRY_RUN: ${{ inputs.dry-run }}
